name: Build CreatorDock desktop release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows NSIS installer
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python for icon validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install icon validation dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: >-
          node -e "const version = require('./src-tauri/tauri.conf.json').version; if ('v' + version !== process.env.GITHUB_REF_NAME) throw new Error('Tag must match Tauri version: v' + version)"

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run unit tests
        run: npm test

      - name: Run type check
        run: npm run typecheck

      - name: Validate platform icons
        run: npm run test:icons

      - name: Validate Windows shortcuts
        run: npm run test:shortcuts

      - name: Run browser end-to-end tests
        run: npm run test:e2e

      - name: Build NSIS installer
        run: npm run tauri build -- --bundles nsis --no-sign --ci

      - name: Verify Desktop shortcut lifecycle
        shell: pwsh
        run: |
          $installer = (Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1).FullName
          ./scripts/Test-CreatorDockInstaller.ps1 -InstallerPath $installer

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: creatordock-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  macos:
    name: macOS universal DMG
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python for icon validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install icon validation dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Set up Rust universal target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: >-
          node -e "const version = require('./src-tauri/tauri.conf.json').version; if ('v' + version !== process.env.GITHUB_REF_NAME) throw new Error('Tag must match Tauri version: v' + version)"

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run unit tests
        run: npm test

      - name: Run type check
        run: npm run typecheck

      - name: Validate platform icons
        run: npm run test:icons

      - name: Run browser end-to-end tests
        run: npm run test:e2e

      - name: Build universal DMG
        run: npm run tauri build -- --target universal-apple-darwin --bundles dmg --no-sign --ci

      - name: Verify universal app bundle and DMG
        shell: bash
        run: |
          set -euo pipefail
          bundle_root="src-tauri/target/universal-apple-darwin/release/bundle"
          app="$(find "$bundle_root/macos" -maxdepth 1 -name '*.app' -print -quit)"
          dmg="$(find "$bundle_root/dmg" -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$app"
          test -n "$dmg"
          test -s "$dmg"
          test -f "$app/Contents/Info.plist"
          test -f "$app/Contents/Resources/icon.icns"
          test -x "$app/Contents/MacOS/creator_dock"
          identifier="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")"
          test "$identifier" = "com.creatordock.desktop"
          architectures="$(lipo -info "$app/Contents/MacOS/creator_dock")"
          echo "$architectures"
          echo "$architectures" | grep -q 'x86_64'
          echo "$architectures" | grep -Eq 'arm64|aarch64'
          hdiutil imageinfo "$dmg" | grep -q 'Format:'

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: creatordock-macos
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  publish:
    name: Attach installers to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: creatordock-windows
          path: release-assets

      - name: Download macOS installer
        uses: actions/download-artifact@v4
        with:
          name: creatordock-macos
          path: release-assets

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
